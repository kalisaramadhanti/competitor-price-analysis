version: 2

models:
  - name: fct_product_price_daily
    description: >
      Latest valid daily price observation for each
      product and platform. Grain: one row per
      product, platform and observation date.

    columns:
      - name: price_observation_id
        data_tests:
          - unique
          - not_null

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product_master')
                field: product_id

      - name: platform_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_platform')
                field: platform_id

      - name: date_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

      - name: price
        data_tests:
          - not_null

      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['IDR']