version: 2


models:
  - name: fct_product_price_daily
    description: >
      Latest valid daily price observation for each
      product and platform. Grain: one row per
      product, platform and observation date.

    columns:
      - name: price_observation_id
        description: Unique identifier for a daily product-platform price observation.
        data_tests:
          - unique
          - not_null

      - name: product_id
        description: Foreign key to the canonical product dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product_master')
                field: product_id

      - name: platform_id
        description: Foreign key to the platform dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_platform')
                field: platform_id

      - name: date_id
        description: Foreign key to the observation date dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

      - name: price
        description: Observed selling price in the specified currency.
        data_tests:
          - not_null

      - name: currency
        description: Currency code for the observed price, currently IDR.
        data_tests:
          - accepted_values:
              arguments:
                values: ['IDR']
