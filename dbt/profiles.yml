competitor_pricing:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: 5432
      user: "{{ env_var('POSTGRES_USER', 'analyst') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: competitor_prices
      schema: public
      threads: 4